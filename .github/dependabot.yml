# Actions ride their major tag (actions/checkout@v7), and Dependabot opens the
# PR when a new major ships. The repo's own scripts are stdlib-only Python.
#
# Every upstream is watched here. One with no manifest a resolver understands,
# emsdk, the vendored doctest and the Zephyr in west.yml, is named as a step in
# .github/pins/action.yml, which only Dependabot reads.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]

  # clang-format and clang-tidy. They live in a requirements.txt rather than in
  # the workflow, because a version inline in a `run:` step is a pin nothing
  # watches: this is the only shape Dependabot can read them in.
  - package-ecosystem: pip
    directory: "/.github/lint"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(lint)"
    groups:
      lint:
        patterns: ["*"]

  # One PR per upstream: emsdk's is tested by the screenshots and the system tests,
  # and doctest's and Zephyr's fail CI until the copy in use follows (scripts/upstream_pins.rb).
  - package-ecosystem: github-actions
    directory: "/.github/pins"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(pins)"

  # Resolve the server's nested Gemfile.
  - package-ecosystem: bundler
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(gems)"
    groups:
      gems:
        patterns: ["*"]
