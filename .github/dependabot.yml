# Actions ride their major tag (actions/checkout@v7), and Dependabot opens the
# PR when a new major ships. Zephyr modules come from west.yml, which Dependabot
# does not read (firmware-deps.yml reports those weekly), and the repo's own
# scripts are stdlib-only Python.
#
# The split: this file is every dependency with a manifest a resolver
# understands, firmware-deps.yml is the two firmware pins that have none.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]

  # clang-format and clang-tidy. They live in a requirements.txt rather than in
  # the workflow, because a version inline in a `run:` step is a pin nothing
  # watches: this is the only shape Dependabot can read them in.
  - package-ecosystem: pip
    directory: "/.github/lint"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(lint)"
    groups:
      lint:
        patterns: ["*"]

  # The website's gems. `directory` is the Gemfile's, not the repo's, so this is
  # the one line that has to know the site is nested.
  - package-ecosystem: bundler
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(gems)"
    groups:
      gems:
        patterns: ["*"]
