name: server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # INFO: fc 17oct26 a run per commit on main, so a later push never cancels a pending deploy.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: server

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' || steps.filter.outputs.protocol == 'true' }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/server.yml'
              - '.github/test/**'
            protocol:
              - 'firmware/core/comms/config.cpp'
              - 'firmware/core/comms/config.h'
              - 'scripts/simulator_scenarios.rb'
              - 'lib/simulator_scenarios.rb'
              - '.github/workflows/firmware.yml'
              - '.github/workflows/release.yml'
              - 'firmware/scenarios/*.json'
              - 'firmware/ui/widgets/skyship.cpp'
              - 'firmware/ui/widgets/skyship.h'

  scan_ruby:
    name: scan Ruby (brakeman, bundler-audit)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    name: scan JS (importmap audit)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint_ruby:
    name: lint Ruby (rubocop)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('server/.ruby-version', 'server/**/.rubocop.yml', 'server/**/.rubocop_todo.yml', 'server/Gemfile.lock') }}
        with:
          path: server/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_smart_quotes:
    name: lint smart quotes
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
      - name: Check for smart quotes
        run: bin/smart_quotes find

  boot:
    name: boot (eager load without the development bundle)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      # A development gem required at load time passes the suite, which has it, and kills the image.
      - name: Check the app eager loads without the development bundle
        run: bin/eager_load_check

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Run tests
        run: bin/rails db:test:prepare test
      - name: Run deployment and release workflow tests
        run: bundle exec ruby ../.github/test/deployment_test.rb
      - name: Run browser protocol and firmware word tests
        run: node --test test/javascript/test_*.mjs
      - name: Check the content sitemap is current
        run: bin/rails content:sitemap:check

  system-test:
    name: system test
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Lift the AppArmor restriction Chrome's sandbox trips on
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run system tests
        env:
          RAILS_ENV: test
          BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bin/rails db:test:prepare test:system
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/server/tmp/screenshots
          if-no-files-found: ignore

  deploy:
    name: deploy with Kamal
    needs: [changes, scan_ruby, scan_js, lint_ruby, lint_smart_quotes, boot, test, system-test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04-arm
    environment:
      name: server_production
      url: https://skyblip.eu
    concurrency:
      group: deploy-server-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - uses: crazy-max/ghaction-github-runtime@v4
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy with Kamal
        run: bundle exec kamal deploy
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SKYBLIP_SERVER_IP: ${{ secrets.SKYBLIP_SERVER_IP }}
