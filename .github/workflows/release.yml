name: release

# A version's tag on main, v<firmware/VERSION>, becomes one draft release: every
# product's image signed with the production key, the simulator, the notices,
# the radio protocol versions, their checksums and their provenance. The draft
# is published by hand, and once published its files cannot change: immutable
# releases are on for this repo.
#
# Every action is pinned by commit, and nothing is restored from a cache: the
# image jobs hold the production key, and a cache or a moved tag is code that
# would run beside it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Before the approval is asked for, so a tag that can never release fails in seconds.
  tag:
    name: tag names a release of main
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      products: ${{ steps.products.outputs.products }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: the tag is firmware/VERSION
        id: version
        run: |
          file=firmware/VERSION
          triple=$(sed -n \
            -e 's/^VERSION_MAJOR *= *\([0-9]*\).*/\1/p' \
            -e 's/^VERSION_MINOR *= *\([0-9]*\).*/\1/p' \
            -e 's/^PATCHLEVEL *= *\([0-9]*\).*/\1/p' "$file" | paste -sd. -)
          test "$GITHUB_REF_NAME" = "v$triple" \
            || { echo "FAIL: tag $GITHUB_REF_NAME, but $file says $triple"; exit 1; }
          echo "version=$triple" >> "$GITHUB_OUTPUT"

      # A product is a directory whose CMakeLists declares its board, so products/common is none.
      - name: every product in the tree
        id: products
        run: |
          products=$(for cmake in firmware/products/*/CMakeLists.txt; do
                       if grep -q '^skyblip_product_board(' "$cmake"; then basename "$(dirname "$cmake")"; fi
                     done | jq -Rnc '[inputs]')
          test "$products" != "[]" || { echo "FAIL: no directory in firmware/products/ declares a board"; exit 1; }
          echo "products=$products" >> "$GITHUB_OUTPUT"

      - name: the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "FAIL: $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: the production key is committed, and is not the development one
        run: |
          test -f firmware/keys/production.pub.pem \
            || { echo "FAIL: no firmware/keys/production.pub.pem (firmware/keys/README.md)"; exit 1; }
          ! cmp -s firmware/keys/production.pub.pem firmware/keys/development.pub.pem \
            || { echo "FAIL: production.pub.pem is the development key"; exit 1; }

  # Its own job, so the Emscripten toolchain never runs on the runner that holds the key.
  simulator:
    name: browser simulator
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.9
          no-cache: true

      - name: build the WASM and bundle the scenarios
        run: |
          make -C firmware browser
          ruby scripts/simulator_scenarios.rb > firmware/build/browser/scenarios.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-simulator
          path: |
            firmware/build/browser/skyblip_simulator.js
            firmware/build/browser/skyblip_simulator.wasm
            firmware/build/browser/embed.js
            firmware/build/browser/scenarios.json
          if-no-files-found: error
          retention-days: 1

  # scripts/build_local.sh on a clean runner, the way anyone can rebuild a release:
  # it fetches the pinned workspace and checks the SDK against its own sha256.sum.
  # One job per product, after the simulator, so the approval is asked once the rest has built.
  image:
    name: signed image (${{ matrix.product }})
    needs: [tag, simulator]
    strategy:
      matrix:
        product: ${{ fromJSON(needs.tag.outputs.products) }}
    environment: firmware_production
    runs-on: ubuntu-24.04
    env:
      PRODUCT: ${{ matrix.product }}
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      # The build number is the commit count, which a shallow clone gets wrong.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install the host build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends cmake ninja-build device-tree-compiler gperf

      - name: provision the signing key
        env:
          PRODUCTION_KEY: ${{ secrets.MCUBOOT_PRODUCTION_SIGNING_KEY }}
        run: |
          test -n "$PRODUCTION_KEY" \
            || { echo "FAIL: the firmware_production environment has no MCUBOOT_PRODUCTION_SIGNING_KEY"; exit 1; }
          (umask 077 && printf '%s\n' "$PRODUCTION_KEY" > "$RUNNER_TEMP/signing.pem")

      - name: build, sign and check the image
        env:
          SKYBLIP_REF: ${{ github.sha }}
          SKYBLIP_WORKSPACE: ${{ runner.temp }}/west
          SKYBLIP_SIGNING_KEY: ${{ runner.temp }}/signing.pem
          SKYBLIP_PUBLIC_KEY: ${{ github.workspace }}/firmware/keys/production.pub.pem
          SKYBLIP_CHANNEL: production
        run: scripts/build_local.sh "$PRODUCT"

      # .signed.confirmed.bin stays behind: the .uf2 carries it, and only a factory line reads it alone.
      - name: name the files after the release
        run: |
          slug=${PRODUCT//_/-}
          mkdir release
          cp "builds/$slug.uf2" "release/$slug-$RELEASE_VERSION.uf2"
          cp "builds/$slug.signed.bin" "release/$slug-$RELEASE_VERSION.signed.bin"
          if [ -f "builds/$slug.full.signed.bin" ]; then
            cp "builds/$slug.full.signed.bin" "release/$slug-$RELEASE_VERSION.full.signed.bin"
          fi
          cat "builds/$slug.version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.product }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  # Every product's images meet here, on a runner without the key, so the jobs that hold it need no token beyond reading the repository.
  files:
    name: release files
    needs: [tag, simulator, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PRODUCTS: ${{ needs.tag.outputs.products }}
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            LICENSE
            NOTICE.md
            LICENSES
            firmware/protocols/*/version.h
            firmware/products/*/PROTOCOLS
            lib/radio_protocols.rb
            scripts/radio_protocols.rb
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-simulator
          path: simulator

      # Only what this run's image jobs named goes into the release: one artifact per product, holding that product's files at this version.
      - name: every product's images, and nothing else
        run: |
          expected=$(jq -r '.[] | "image-" + .' <<< "$PRODUCTS" | sort)
          found=$(find images -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "$found" = "$expected" \
            || { echo "FAIL: the artifacts are ${found//$'\n'/ }, where the products ask for ${expected//$'\n'/ }"; exit 1; }
          mkdir -p release
          for product in $(jq -r '.[]' <<< "$PRODUCTS"); do
            slug=${product//_/-} artifact=images/image-$product
            while IFS= read -r file; do
              case "$file" in
                "$slug-$RELEASE_VERSION.uf2"|"$slug-$RELEASE_VERSION.signed.bin"|"$slug-$RELEASE_VERSION.full.signed.bin") ;;
                *) echo "FAIL: image-$product holds $file"; exit 1 ;;
              esac
            done < <(find "$artifact" -mindepth 1 -printf '%P\n')
            for file in "$slug-$RELEASE_VERSION.uf2" "$slug-$RELEASE_VERSION.signed.bin"; do
              test -f "$artifact/$file" || { echo "FAIL: image-$product has no $file"; exit 1; }
            done
            cp "$artifact"/* release/
          done

      - name: add the simulator, the notices, the radio protocols and the checksums
        run: |
          cp simulator/skyblip_simulator.js simulator/skyblip_simulator.wasm simulator/embed.js release/
          cp simulator/scenarios.json release/
          cp LICENSE NOTICE.md LICENSES/*.txt release/
          ruby scripts/radio_protocols.rb firmware "$RELEASE_VERSION" "$PRODUCTS" > release/PROTOCOLS.md
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/PROTOCOLS.md release/SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/*
          if-no-files-found: error

  # Its own job, so the token that can write a release never shares a runner with the key.
  draft:
    name: draft release
    needs: files
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # The notes start at the last published release. The briefing shows pilots the two news sections, under these exact headings, and its technical list is what GitHub generates.
      - name: create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" -L 100 --exclude-drafts --exclude-pre-releases \
                   --json tagName --jq '.[].tagName')
          previous=$(grep -m1 -E '^v[0-9]' <<< "$tags") || previous=""
          news=$(printf '%s\n' \
            "## What's new" "" "<!-- For pilots, in English: one \"- \" line per change they will notice. -->" "" \
            "## Nouveautés" "" "<!-- Pour les pilotes, en français : une ligne « - » par changement qu'ils remarqueront. -->")
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes "$news" --generate-notes ${previous:+--notes-start-tag "$previous"}
