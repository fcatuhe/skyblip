name: firmware

# Everything in this tree but the server and prose: firmware/ and the scripts, schemas and harnesses it is tested through.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run on main is the record of what the merged tree does, so it is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Keep the required check present without cross-building Rails-only changes.
  changes:
    name: what changed
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      glass: ${{ steps.filter.outputs.glass }}
      release: ${{ steps.filter.outputs.release }}
      spec: ${{ steps.filter.outputs.spec }}
      products: ${{ steps.products.outputs.products }}
      # main signs with the development key, and so does any branch run by hand: a pull request never.
      signing: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'development' || '' }}
    steps:
      - uses: actions/checkout@v7
      # A product is a directory whose CMakeLists declares its board (lib/firmware_tree.rb).
      - name: every product in the tree
        id: products
        run: echo "products=$(ruby scripts/firmware_tree.rb products firmware)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # Prose no check reads. The firmware's READMEs stay in: docs/TUNING.md and the protocol locks read them.
            firmware:
              - '!(server)/**'
              - '!*.md'
              - '!docs/!(BEHAVIOR|TUNING).md'
              - '!docs/bench/*.md'
              - '!scripts/*.md'
              - '!.agents/**'
            # What goes into a published image, so a change elsewhere publishes no build. lib/dev_release.rb lists the same paths.
            release:
              - 'firmware/**'
              - 'scripts/build_image.sh'
              - 'scripts/mkuf2.py'
            # The specifications check_spec_markdown.py rereads, and its converter.
            spec:
              - 'docs/reference/**'
              - 'scripts/layout_to_md.py'
              - 'scripts/check_spec_markdown.py'
            # What bin/screenshots compiles and flies, and the pictures it writes.
            glass:
              - 'firmware/core/**'
              - 'firmware/ui/**'
              - 'firmware/ports/**'
              - 'firmware/runtime/**'
              - 'firmware/hardware/parts/**'
              - 'firmware/products/**'
              - 'firmware/simulator/**'
              - 'firmware/vendor/**'
              - 'firmware/Makefile'
              - '.github/pins/action.yml'
              - 'server/bin/screenshots'
              - 'server/bin/blips.cpp'
              - 'server/content_images/pages/skyblip-go/**'

  host-tests:
    # arm64 on purpose: plain `char` is unsigned there, as on the Cortex-M target.
    name: host unit tests (doctest)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - name: install ccache and cmake
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ccache cmake
      - name: cache the compiled objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-plain-${{ github.sha }}
          restore-keys: ccache-plain-
      - name: build & run host tests
        working-directory: firmware
        run: make test CXX="ccache g++"
      # Another project takes a stack with its tests, so each must build from a copy holding nothing of skyBlip's.
      - name: each radio protocol stack builds and passes alone
        working-directory: firmware
        run: make test-protocols CXX="ccache g++"
      - name: the protocol stacks include nothing from skyBlip
        run: python3 scripts/check_protocol_boundary.py
      - name: every frozen protocol stack matches its version.lock
        run: python3 scripts/check_protocol_freeze.py
      - name: test-coverage structural gate
        run: python3 scripts/check_test_coverage.py
      - name: every clause of ADS-L, EN 300 220 and DO-260B has a case
        run: python3 scripts/check_clauses.py
      # The suites read the markdown, so a word the conversion lost is a requirement nobody reads.
      - name: the ADS-L markdown carries every word of its PDF, in order
        if: needs.changes.outputs.spec == 'true'
        run: |
          sudo apt-get install -yq --no-install-recommends poppler-utils
          python3 scripts/check_spec_markdown.py
      - name: tuning constants read as the vocabulary asks
        run: python3 scripts/check_tuning_names.py
      # The generated C++ is compared as clang-format writes it, so the check and its test need the lint job's pinned formatter.
      - name: install the pinned clang-format
        run: pip install --disable-pip-version-check "$(grep '^clang-format==' .github/lint/requirements.txt)"
      - name: the link registry is described, its generated files are current and the status writer matches it
        run: python3 scripts/check_link_registry.py
      - name: the browser simulator binds only what it exports
        run: python3 scripts/check_simulator_exports.py
      # Dependabot proposes doctest and Zephyr in .github/pins, and the copies in use have to follow.
      - name: the vendored doctest and the Zephyr pin match .github/pins
        run: ruby scripts/upstream_pins.rb check
      - name: the Python self-checks
        run: python3 -m unittest discover -s scripts
      # A page not committed is a diff too.
      - name: behavior index matches the suite
        run: |
          python3 scripts/behavior_index.py
          git add --intent-to-add docs/BEHAVIOR.md docs/behavior
          git diff --exit-code docs/BEHAVIOR.md docs/behavior
      # The declaration of conformity attaches docs/ADSL_CONFORMANCE.md, so it must be the suite as it runs.
      - name: ADS-L and DO-260B reports match the suite
        run: |
          python3 scripts/conformance.py adsl
          python3 scripts/conformance.py adsb
          git add --intent-to-add docs/ADSL_CONFORMANCE.md docs/ADSB_CONFORMANCE.md
          git diff --exit-code docs/ADSL_CONFORMANCE.md docs/ADSB_CONFORMANCE.md
      - name: tuning index matches the sources
        run: |
          python3 scripts/tuning_index.py
          git diff --exit-code docs/TUNING.md

  # Beside host-tests, not after it: a read past a frame passes a plain run by luck.
  host-tests-sanitized:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host unit tests (ASan + UBSan)
            runner: ubuntu-26.04-arm
            abi: ''
            tree: sanitize
            cxx: g++
            packages: ccache
          # i386 is ILP32 like the nRF52, so a long that overflows past 2^31 there overflows here.
          - name: host unit tests (ASan + UBSan, ILP32)
            runner: ubuntu-26.04
            abi: ilp32
            tree: sanitize-ilp32
            cxx: clang++
            packages: ccache clang libclang-rt-dev g++-multilib
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - name: install the toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.packages }}
      - name: cache the compiled objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.tree }}-
      - name: build & run host tests under sanitizers
        working-directory: firmware
        run: make test-sanitize ABI=${{ matrix.abi }} CXX="ccache ${{ matrix.cxx }}"

  # The radio, the GNSS UART and the companion link, a minute each (firmware/test/fuzz/README.md).
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libFuzzer (radio, NMEA, companion link)
            runner: ubuntu-26.04-arm
            abi: ''
            tree: fuzz
            packages: clang libclang-rt-dev ccache
          - name: libFuzzer (radio, NMEA, companion link, ILP32)
            runner: ubuntu-26.04
            abi: ilp32
            tree: fuzz-ilp32
            packages: clang libclang-rt-dev g++-multilib ccache
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      # libFuzzer's runtime is libclang-rt-dev, which clang only recommends.
      - name: install clang and ccache
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.packages }}
      # Its own cache key, because -fsanitize=fuzzer-no-link instruments every object.
      - name: cache the compiled objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.tree }}-
      - name: cache the corpus
        uses: actions/cache@v6
        with:
          path: firmware/build/${{ matrix.tree }}/corpus
          key: corpus-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: corpus-${{ matrix.tree }}-
      - name: build & run the fuzzers
        working-directory: firmware
        run: make fuzz ABI=${{ matrix.abi }} FUZZ_CXX="ccache clang++"
      - name: upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashes-${{ matrix.tree }}
          path: firmware/build/${{ matrix.tree }}/crashes/
          if-no-files-found: ignore

  lint:
    name: clang-format + clang-tidy
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      # Pinned in .github/lint/requirements.txt, because the runner's clang-format 18 formats brace-init differently.
      - name: install clang-format and clang-tidy
        run: pip install --disable-pip-version-check -r .github/lint/requirements.txt
      - name: check formatting
        run: |
          find firmware/protocols firmware/core firmware/ui firmware/ports firmware/hardware \
               firmware/boards firmware/runtime firmware/products firmware/simulator firmware/test \
            -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      # The tree is clean, so the config fails the job on any finding at all.
      - name: check the C++ subset rules
        run: make -C firmware tidy

  # A pull request signs with a key made for the run, so its image updates no unit.
  product-image:
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.changes.outputs.products) }}
    name: product image (${{ matrix.product }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    # x86_64, because on arm runners the Zephyr SDK fails to register its CMake package.
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.changes.outputs.signing && format('firmware_{0}', needs.changes.outputs.signing) || '' }}
      deployment: false
    steps:
      # The build number is the commit count, which a shallow clone gets wrong.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: cache the west workspace
        uses: actions/cache@v6
        with:
          path: |
            zephyr
            modules
            bootloader
          key: west-${{ hashFiles('firmware/west.yml') }}

      - name: set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: provision the signing key
        working-directory: firmware
        env:
          DEVELOPMENT_KEY: ${{ secrets.MCUBOOT_DEVELOPMENT_SIGNING_KEY }}
          SIGNED_FOR: ${{ needs.changes.outputs.signing }}
        run: |
          key=$RUNNER_TEMP/signing.pem
          if [ -n "$SIGNED_FOR" ]; then
            test -n "$DEVELOPMENT_KEY" \
              || { echo "FAIL: the firmware_development environment has no MCUBOOT_DEVELOPMENT_SIGNING_KEY"; exit 1; }
            (umask 077 && printf '%s\n' "$DEVELOPMENT_KEY" > "$key")
            echo "PUBLIC_KEY=firmware/keys/development.pub.pem" >> "$GITHUB_ENV"
          else
            python3 "$(west topdir)/bootloader/mcuboot/scripts/imgtool.py" keygen -k "$key" -t ecdsa-p256
            echo "signed with a key made for this run: the image updates no unit"
          fi

      - name: build, sign and check the image
        run: scripts/build_image.sh ${{ matrix.product }} "$RUNNER_TEMP/signing.pem" "${PUBLIC_KEY:-}"

      # The version record reads "<slug> <version> <commit> <channel>".
      - name: name the artifact after the product and its version
        if: env.PUBLIC_KEY != ''
        run: echo "IMAGE_NAME=$(cut -d' ' -f1,2 --output-delimiter=- firmware/build/out/*.version)" >> "$GITHUB_ENV"

      - name: upload the development image
        if: env.PUBLIC_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}
          path: firmware/build/out/*
          if-no-files-found: error
          retention-days: 1

  simulator:
    name: browser simulator
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || needs.changes.outputs.glass == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Read the emsdk version .github/pins holds
        id: emsdk
        run: |
          version=$(ruby scripts/upstream_pins.rb version emscripten-core/emsdk)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache
      - name: Build the WASM and bundle the scenarios
        run: make -C firmware browser
      # The site shows the glass as the firmware draws it, so a change to the glass carries its pictures.
      - name: The device screenshots are the firmware's own
        if: needs.changes.outputs.glass == 'true'
        run: |
          server/bin/screenshots
          git diff --exit-code server/content_images
      - uses: actions/upload-artifact@v7
        with:
          name: browser-simulator
          path: |
            firmware/build/browser/skyblip_simulator.js
            firmware/build/browser/skyblip_simulator.wasm
            firmware/build/browser/embed.js
            firmware/build/browser/scenarios.json
          if-no-files-found: error
          retention-days: 1

  # Every product's development image goes into one pre-release, by the rules of lib/dev_release.rb.
  dev-release:
    name: dev pre-release
    needs: [changes, product-image, simulator]
    if: needs.changes.outputs.signing == 'development' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: skyblip-*
          path: image
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: browser-simulator
          path: simulator

      # The notices, protocol versions and publisher come from the commit the images were built from.
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
          sparse-checkout: |
            LICENSE
            NOTICE.md
            LICENSES
            firmware/protocols/*/version.h
            firmware/products/*/PROTOCOLS
            lib/dev_release.rb
            lib/radio_protocols.rb
            lib/release_files.rb
            lib/release_notice.rb
            scripts/dev_release.rb
          sparse-checkout-cone-mode: false

      # A rerun of one commit stamps the same number, which a unit would refuse anyway.
      - name: create the pre-release and prune the old ones
        run: ruby source/scripts/dev_release.rb image simulator source

  platform-adapters:
    # The Zephyr adapters the host suite cannot build, run on native_sim, and the X1's smoke image (#169).
    name: platform adapters (native_sim, meshtracker_x1)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Restored before the setup action's `west update`, which then fetches nothing, keyed on the manifest.
      - name: cache the west workspace
        uses: actions/cache@v6
        with:
          path: |
            zephyr
            modules
            bootloader
          key: west-${{ hashFiles('firmware/west.yml') }}

      - name: set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: twister
        working-directory: firmware
        run: |
          python3 "$(west topdir)/zephyr/scripts/twister" \
            -T test/twister -p native_sim -p meshtracker_x1 --inline-logs

      # Twister names its build directory after the test's path, so the smoke build is found, not spelled.
      - name: the X1 smoke image fits its slot and its RAM, and installs by drag-and-drop inside the X1's window
        working-directory: firmware
        run: |
          smoke=$(find twister-out -type d -name boards.meshtracker_x1.platform)
          test "$(printf '%s\n' "$smoke" | grep -c .)" = 1 \
            || { echo "FAIL: expected one X1 smoke build under twister-out, found: ${smoke:-none}"; exit 1; }
          python3 ../scripts/size_check.py "$smoke/meshtracker_x1/zephyr/zephyr.elf"
          mkdir -p build
          ZEPHYR_BASE="$(west topdir)/zephyr" python3 ../scripts/mkuf2.py meshtracker_x1 build/meshtracker-x1-smoke.uf2 \
            "$smoke/mcuboot/zephyr/zephyr.hex" "$smoke/meshtracker_x1/zephyr/zephyr.signed.confirmed.hex"

      # The first bench session (#169) starts from this file, signed with MCUboot's published development key.
      - name: upload the X1 smoke image
        uses: actions/upload-artifact@v7
        with:
          name: meshtracker-x1-smoke
          path: firmware/build/meshtracker-x1-smoke.uf2
          if-no-files-found: error
          retention-days: 7
