name: firmware

# Everything in this tree that is not the server: firmware/, plus the scripts,
# schemas and simulator harnesses the firmware is tested through. The site has
# its own workflow, its dependencies are Dependabot's, and the two C++ pins that
# Dependabot cannot read are firmware-deps.yml's.
#
# A push to a branch with an open PR already fires `pull_request`; main is the
# post-merge signal, and this repo never commits to it directly.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run on main: that one is the record of what the merged tree does.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Keep the required check present without cross-building Rails-only changes.
  changes:
    name: what changed
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      # main signs with the development key, and so does any branch run by hand: a pull request never.
      signing: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'development' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            firmware:
              - '!(server)/**'

  host-tests:
    # arm64 on purpose: plain `char` is unsigned there, as on the Cortex-M target.
    name: host unit tests (doctest)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      # A PR recompiles the few files it touched, not all 155 translation units.
      - name: install ccache and cmake
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ccache cmake
      - name: cache the compiled objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-plain-${{ github.sha }}
          restore-keys: ccache-plain-
      - name: build & run host tests
        working-directory: firmware
        run: make test CXX="ccache g++"
      - name: test-coverage structural gate
        run: python3 scripts/check_test_coverage.py
      # firmware/test/adsl/ reads the published specification clause by clause, and a
      # clause nobody read is the one a product is found non-conformant on.
      - name: every ADS-L clause has a case
        run: python3 scripts/check_adsl_clauses.py
      # A hold, a settle and a floor behave nothing alike, and a tree that spells
      # them three ways is a tree where nobody can grep for the one they mean.
      - name: tuning constants read as the vocabulary asks
        run: python3 scripts/check_tuning_names.py
      # The generated C++ is compared as clang-format writes it, so the check needs the lint job's pinned formatter.
      - name: install the pinned clang-format
        run: pip install --disable-pip-version-check "$(grep '^clang-format==' .github/lint/requirements.txt)"
      # The firmware, the simulator, the suite and the server read the link's numbers from files generated off one registry, and phones read the status frame it describes unasked.
      - name: the link registry is described, its generated files are current and the status writer matches it
        run: python3 scripts/check_link_registry.py
      - name: the registry check refuses a file that differs by one byte
        run: python3 scripts/test_link_registry.py
      # All that stands between a partition edit and an install that erases the
      # factory bootloader. Stdlib only, so it runs here and not on the slow job.
      - name: mkuf2 range guards
        run: python3 scripts/test_mkuf2.py
      # The update page picks the file a unit needs off two TLVs: an image without them makes it guess.
      - name: the image says which hub image it pins
        run: python3 scripts/test_check_imu_image.py
      # A unit takes only an image naming its own product, and nothing while it runs one naming none.
      - name: the image names its product
        run: python3 scripts/test_check_image_product.py
      # The budgets come off each build's slot and SRAM, and a build with no slot fails.
      - name: the size check holds each target to its flash and RAM budgets
        run: python3 scripts/test_size_check.py
      # The Go turns all three switches on, so only this configure sees a product that has none.
      - name: a product without activation, a hub or a central builds no unit key, no hub image and no central
        run: python3 scripts/test_shared_layers.py
      # A Nordic DFU install stores a real CRC the first MCUboot swap breaks, and the
      # device then sits in DFU mode until someone drops a .uf2 on it by hand.
      - name: no Nordic DFU package
        run: python3 scripts/check_no_dfu_package.py
      # embed.js binds the firmware by C name, resolved only when a page loads the module.
      - name: the browser simulator binds only what it exports
        run: python3 scripts/check_simulator_exports.py
      # The host decoder and the firmware's record layout are one layout written
      # twice, and a corpus decoded wrong is worse than one that failed to decode.
      - name: blip decoders, NMEA reassembly and resume
        run: python3 scripts/test_blip.py
      # The budget reads the Duty counters by name and subtracts across their wrap:
      # a field that moves in payload.h must fail here, not read as a quiet zero.
      - name: power budget deltas, postures and caveats
        run: python3 scripts/test_power_budget.py
      # The link budget pairs Burst records and reads Config's transmitter bytes: a field
      # that moves in payload.h, or a figure that moves in sx1262.h, must fail here.
      - name: link budget pairing, free space and what it sets
        run: python3 scripts/test_link_budget.py
      # docs/BEHAVIOR.md is generated from the test names: a rename that does not
      # land with the doc leaves the repo claiming behavior the suite dropped.
      - name: behavior index matches the suite
        run: |
          python3 scripts/behavior_index.py
          git diff --exit-code docs/BEHAVIOR.md
      # docs/TUNING.md is generated from the constants themselves: a threshold
      # that moves without its note moving is the whole point of the gate.
      - name: tuning index matches the sources
        run: |
          python3 scripts/tuning_index.py
          git diff --exit-code docs/TUNING.md

  # Beside host-tests, not after it: a read past a frame passes a plain run by luck.
  host-tests-sanitized:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host unit tests (ASan + UBSan)
            runner: ubuntu-26.04-arm
            abi: ''
            tree: sanitize
            cxx: g++
            packages: ccache
          # i386 is ILP32 like the nRF52, so a long that overflows past 2^31 there overflows here.
          - name: host unit tests (ASan + UBSan, ILP32)
            runner: ubuntu-26.04
            abi: ilp32
            tree: sanitize-ilp32
            cxx: clang++
            packages: ccache clang libclang-rt-dev g++-multilib
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - name: install the toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.packages }}
      # Its own cache key: the sanitized objects share nothing with the plain ones.
      - name: cache the compiled objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.tree }}-
      - name: build & run host tests under sanitizers
        working-directory: firmware
        run: make test-sanitize ABI=${{ matrix.abi }} CXX="ccache ${{ matrix.cxx }}"

  # The radio, the GNSS UART and the companion link, a minute each (firmware/test/fuzz/README.md).
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libFuzzer (radio, NMEA, companion link)
            runner: ubuntu-26.04-arm
            abi: ''
            tree: fuzz
            packages: clang libclang-rt-dev ccache
          - name: libFuzzer (radio, NMEA, companion link, ILP32)
            runner: ubuntu-26.04
            abi: ilp32
            tree: fuzz-ilp32
            packages: clang libclang-rt-dev g++-multilib ccache
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      # libFuzzer's runtime is libclang-rt-dev, which clang only recommends.
      - name: install clang and ccache
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.packages }}
      # Its own cache key: -fsanitize=fuzzer-no-link instruments every object.
      - name: cache the compiled objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.tree }}-
      # A minute from the seeds alone finds little, a minute on top of every earlier run finds more.
      - name: cache the corpus
        uses: actions/cache@v6
        with:
          path: firmware/build/${{ matrix.tree }}/corpus
          key: corpus-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: corpus-${{ matrix.tree }}-
      - name: build & run the fuzzers
        working-directory: firmware
        run: make fuzz ABI=${{ matrix.abi }} FUZZ_CXX="ccache clang++"
      - name: upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashes-${{ matrix.tree }}
          path: firmware/build/${{ matrix.tree }}/crashes/
          if-no-files-found: ignore

  lint:
    name: clang-format + clang-tidy
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      # Pinned in .github/lint/requirements.txt, where Dependabot can see them:
      # the runner image ships clang-format 18, which reformats brace-init
      # differently, so an unpinned formatter is a gate that changes its mind.
      - name: install clang-format and clang-tidy
        run: pip install --disable-pip-version-check -r .github/lint/requirements.txt
      - name: check formatting
        run: |
          find firmware/core firmware/ui firmware/ports firmware/hardware firmware/boards \
               firmware/runtime firmware/products firmware/simulator firmware/test \
            -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      # The tree is clean, so the config fails the job on any finding at all.
      - name: check the C++ subset rules
        run: make -C firmware tidy

  # A pull request is signed with a key made for the run: the build and the signing
  # are proven end to end, and the image updates no unit. main, and a branch run by
  # hand (Run workflow, or gh workflow run firmware.yml --ref <branch>), are signed
  # with the development key. Releases are release.yml's, with the production key.
  product-image:
    strategy:
      fail-fast: false
      # `slug` is the product as a human writes it: the board name carries an
      # underscore Zephyr requires, and expressions have no replace().
      # Bravo's image is kept a week, as the X1 smoke image is, until #204 publishes it as a pre-release.
      matrix:
        include:
          - product: skyblip_go
            slug: skyblip-go
            retention: 1
          - product: skyblip_bravo
            slug: skyblip-bravo
            retention: 7
    name: product image (${{ matrix.product }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    # x86_64, unlike the host jobs: the cross output is identical either way, and
    # on arm runners the Zephyr SDK fails to register its CMake package
    # (FindZephyr-sdk.cmake:57 dies on an empty variable).
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.changes.outputs.signing && format('firmware_{0}', needs.changes.outputs.signing) || '' }}
      deployment: false
    steps:
      # The build number is the commit count, which a shallow clone gets wrong.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: cache the west workspace
        uses: actions/cache@v6
        with:
          path: |
            zephyr
            modules
            bootloader
          key: west-${{ hashFiles('firmware/west.yml') }}

      - name: set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: provision the signing key
        working-directory: firmware
        env:
          DEVELOPMENT_KEY: ${{ secrets.MCUBOOT_DEVELOPMENT_SIGNING_KEY }}
          SIGNED_FOR: ${{ needs.changes.outputs.signing }}
        run: |
          key=$RUNNER_TEMP/signing.pem
          if [ -n "$SIGNED_FOR" ]; then
            test -n "$DEVELOPMENT_KEY" \
              || { echo "FAIL: the firmware_development environment has no MCUBOOT_DEVELOPMENT_SIGNING_KEY"; exit 1; }
            (umask 077 && printf '%s\n' "$DEVELOPMENT_KEY" > "$key")
            echo "PUBLIC_KEY=firmware/keys/development.pub.pem" >> "$GITHUB_ENV"
          else
            python3 "$(west topdir)/bootloader/mcuboot/scripts/imgtool.py" keygen -k "$key" -t ecdsa-p256
            echo "signed with a key made for this run: the image updates no unit"
          fi

      - name: build, sign and check the image
        run: scripts/build_image.sh ${{ matrix.product }} "$RUNNER_TEMP/signing.pem" "${PUBLIC_KEY:-}"

      - name: name the artifact after its version
        if: env.PUBLIC_KEY != ''
        run: echo "IMAGE_VERSION=$(cut -d' ' -f2 firmware/build/out/${{ matrix.slug }}.version)" >> "$GITHUB_ENV"

      - name: upload the development image
        if: env.PUBLIC_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slug }}-${{ env.IMAGE_VERSION }}
          path: firmware/build/out/*
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

  simulator:
    name: browser simulator
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Build WASM
        run: make -C firmware browser
      - name: Bundle simulator scenarios
        run: ruby scripts/simulator_scenarios.rb > firmware/build/browser/scenarios.json
      - uses: actions/upload-artifact@v7
        with:
          name: browser-simulator
          path: |
            firmware/build/browser/skyblip_simulator.js
            firmware/build/browser/skyblip_simulator.wasm
            firmware/build/browser/embed.js
            firmware/build/browser/scenarios.json
          if-no-files-found: error
          retention-days: 1

  # Each product's development image becomes its own pre-release, one click from the
  # Releases page: dev-<build> for main, the newest three kept, dev-<build>-<branch> for
  # a branch run by hand, the newest kept until its pull request closes. Every product
  # but the Go puts its name in front, as in bravo-dev-<build>. A new tag per build,
  # because immutable releases lock a published one, and a deleted name is never reused.
  # The rules are lib/dev_release.rb's, tested in .github/test/dev_release_test.rb.
  dev-release:
    name: dev pre-release
    needs: [changes, product-image, simulator]
    if: needs.changes.outputs.signing == 'development'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Every product's files start with its own slug, so the images share one directory.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyblip-*
          path: image
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: browser-simulator
          path: simulator

      # The third-party notices travel with every image, so they come from the commit it was built from, as does the publisher.
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
          sparse-checkout: |
            LICENSE
            NOTICE.md
            LICENSES
            lib/dev_release.rb
            scripts/dev_release.rb
          sparse-checkout-cone-mode: false

      # A rerun of one commit stamps the same number, which a unit would refuse anyway.
      - name: create and prune each product's pre-releases
        run: ruby source/scripts/dev_release.rb image simulator source

  platform-adapters:
    # What the pure-host suite cannot build: the Zephyr adapters, run where
    # native_sim can. product-image compiles the ones it cannot, and the X1's
    # smoke image, MCUboot with a signed app, is built and size-checked here for the bench's first session (#169).
    name: platform adapters (native_sim, meshtracker_x1)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Restored before the setup action runs its `west update`, which then finds
      # every pinned revision already checked out and fetches nothing. The action
      # caches pip, the SDK and ccache itself, but not the clones, and those are
      # most of the minute it spends. Keyed on the manifest, the only thing that
      # can move them.
      - name: cache the west workspace
        uses: actions/cache@v6
        with:
          path: |
            zephyr
            modules
            bootloader
          key: west-${{ hashFiles('firmware/west.yml') }}

      - name: set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: twister
        working-directory: firmware
        run: |
          # ZEPHYR_BASE is not in this step's env, so ask west for the workspace.
          python3 "$(west topdir)/zephyr/scripts/twister" \
            -T test/twister -p native_sim -p meshtracker_x1 --inline-logs

      # Twister names its build directory after the test's path, so the one smoke build is found rather than spelled.
      - name: the X1 smoke image fits its slot and its RAM, and installs by drag-and-drop inside the X1's window
        working-directory: firmware
        run: |
          smoke=$(find twister-out -type d -name boards.meshtracker_x1.platform)
          test "$(printf '%s\n' "$smoke" | grep -c .)" = 1 \
            || { echo "FAIL: expected one X1 smoke build under twister-out, found: ${smoke:-none}"; exit 1; }
          python3 ../scripts/size_check.py "$smoke/meshtracker_x1/zephyr/zephyr.elf"
          mkdir -p build
          ZEPHYR_BASE="$(west topdir)/zephyr" python3 ../scripts/mkuf2.py meshtracker_x1 build/meshtracker-x1-smoke.uf2 \
            "$smoke/mcuboot/zephyr/zephyr.hex" "$smoke/meshtracker_x1/zephyr/zephyr.signed.confirmed.hex"

      # The first bench session (#169) starts from this file, signed with MCUboot's published development key.
      - name: upload the X1 smoke image
        uses: actions/upload-artifact@v7
        with:
          name: meshtracker-x1-smoke
          path: firmware/build/meshtracker-x1-smoke.uf2
          if-no-files-found: error
          retention-days: 7
