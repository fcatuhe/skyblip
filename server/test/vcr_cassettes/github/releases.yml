        and signed with the development key.\n\n## skyBlip Bravo\n\nRadio protocols:
        ADS-B 0.1.0.\n\n- `.signed.bin` installs over Bluetooth only on a unit whose
        bootloader trusts that key ([firmware/keys](https://github.com/fcatuhe/skyblip/tree/main/firmware/keys)),
        older builds included.\n- `.uf2` installs on any unit by drag-and-drop, and
        moves it to the development key.\n\n## skyBlip Go\n\nRadio protocols: ADS-L
        0.1.0, ALP-TAS 0.1.0.\n\n- `.signed.bin` installs over Bluetooth only on a
        unit whose bootloader trusts that key ([firmware/keys](https://github.com/fcatuhe/skyblip/tree/main/firmware/keys)),
        older builds included.\n- `.full.signed.bin` is the same image with the sensor
        hub''s firmware, for a unit the update page asks it for.\n- `.uf2` installs
