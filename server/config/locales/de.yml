    own_bursts: "Go kann mit dem Senden beginnen"
    own_bursts_short: "eigene Aussendungen"
    switch: "10 ms Wechsel zwischen Fenstern"
  cycle:
    title: "Der Zyklus von 20 s"
    description: "Zwanzig Sekunden ab c, dem durch die Seriennummer bestimmten Zyklusbeginn. Am Boden: eine Position auf A bei c, eine Statusmeldung auf B bei c + 2, ein Rufzeichen auf B zu Beginn von c + 5, eine Position auf B bei c + 9, eine Statusmeldung auf A bei c + 11 und ein Rufzeichen auf B zu Beginn von c + 15. Im Flug kommt jede Sekunde eine Position hinzu, auf A in geraden und auf B in ungeraden Sekunden. Sonst bleibt der Zeitplan unverändert."
    ground: "Am Boden"
