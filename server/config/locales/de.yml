    title: "Eine UTC-Sekunde"
    description: "Eine Sekunde von 0 bis 1200 ms: Go empfängt auf dem Uplink von 210 bis 440 ms, auf Kanal A von 450 bis 820 ms und auf Kanal B von 830 bis 1200 ms. Zwischen den Fenstern dauert der Wechsel 10 ms. Positionen und Statusmeldungen beginnen auf A von 450 bis 810 ms oder auf B von 830 bis 990 ms. Das Rufzeichen beginnt auf B von 1000 bis 1190 ms, nachdem das direkte ADS-L-Fenster bei 1000 ms endet."
