  flight_state:
    title: "Im Flug oder am Boden"
    description: "Geschwindigkeit über Grund von 0 bis 14 m/s. Am Boden wechselt Go bei 12 m/s, also 23 kt, in den Flugstatus. Im Flug wechselt er unter 1 m/s oder nach 10 s unter 8 m/s zurück in den Bodenzustand. Zwischen den Schwellen bleibt der Status gleich. Am Boden zeigt das Display ab 1,5 m/s TAXI und unter 1 m/s wieder GROUND."
