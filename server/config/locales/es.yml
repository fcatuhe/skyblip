    title: "Un segundo UTC"
    description: "Un segundo de 0 a 1200 ms: el Go escucha el enlace ascendente de 210 a 440 ms, el canal A de 450 a 820 ms y el B de 830 a 1200 ms. Tarda 10 ms en cambiar de ventana. Las posiciones y los mensajes Status empiezan entre 450 y 810 ms en A o entre 830 y 990 ms en B. El indicativo empieza entre 1000 y 1190 ms en B, después de que termine el intervalo directo de ADS-L a los 1000 ms."
