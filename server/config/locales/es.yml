    description: "Visto desde arriba y de lado, el volumen alrededor de tu aeronave es un cilindro bajo: 3 km en horizontal y 300 m por encima y por debajo. Una aeronave dentro activa un aviso. Una a más de 3 km, otra a más de 300 m por encima y otra en tierra no lo activan."
