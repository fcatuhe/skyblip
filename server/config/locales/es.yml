    own_bursts: "pueden empezar las ráfagas del Go"
    own_bursts_short: "ráfagas del Go"
    switch: "10 ms para cambiar de ventana"
  cycle:
    title: "El ciclo de 20 s"
    description: "Veinte segundos a partir de c, el inicio del ciclo que fija el número de serie. En tierra: una posición en A en c, un Status en B en c + 2, un indicativo en B al inicio de c + 5, una posición en B en c + 9, un Status en A en c + 11 y un indicativo en B al inicio de c + 15. En vuelo se añade una posición cada segundo, en A en segundos pares y en B en impares. Lo demás no cambia."
    ground: "En tierra"
    airborne: "En vuelo"
    position: "posición"
    status: "Status"
    callsign: "indicativo"
    added: "añadida en vuelo"
    serial: "La última cifra del número de serie fija c"
    digit: "última cifra"
  flight_state:
    title: "En vuelo o en tierra"
    description: "Velocidad respecto al suelo de 0 a 14 m/s. El Go detecta el despegue a 12 m/s, 23 kt. En vuelo, detecta el aterrizaje por debajo de 1 m/s o tras 10 s por debajo de 8 m/s. Entre umbrales, conserva el estado anterior. En tierra, la pantalla muestra TAXI a partir de 1,5 m/s y vuelve a GROUND por debajo de 1 m/s."
    airborne: "En vuelo"
    ground: "En tierra"
    between: "entre umbrales,"
