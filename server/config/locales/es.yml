  llms:
    intro: "skyBlip es de código abierto, sin suscripción y sin cuenta. Los enlaces de abajo llevan a la versión Markdown de cada página. Cada página de skyblip.eu responde en Markdown en su dirección seguida de `.md`, o a una petición que acepta `text/markdown`. Una página aún sin traducir aparece aquí en inglés. [llms-full.txt](%{full}) reúne todas estas páginas en un solo archivo, y [feed.atom](%{feed}) las lista por el día de su último cambio. El servidor MCP de skyBlip, %{mcp}, lista, busca y lee las mismas páginas, sin cuenta."
    full_intro: "Todas las páginas de skyblip.eu en español, una tras otra, cada una bajo su dirección. Una página aún sin traducir aparece aquí en inglés."
    source_code: "Código fuente"
    source_code_description: "el firmware y este sitio web, con licencia MIT."
    other_languages: "Otros idiomas"
