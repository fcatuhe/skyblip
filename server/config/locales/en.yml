    listening: "listening"
    own_bursts: "the Go's own bursts may start"
    own_bursts_short: "own bursts"
    switch: "10 ms switch between windows"
  cycle:
    title: "The 20 s cycle"
    description: "Twenty seconds from c, the cycle start set by the serial. On the ground: a position on A at c, a Status on B at c + 2, a callsign on B on air at the start of c + 5, a position on B at c + 9, a Status on A at c + 11 and a callsign on B on air at the start of c + 15. Airborne adds a position every second, on A in even seconds and B in odd ones, and moves nothing else."
    ground: "On the ground"
    airborne: "Airborne"
    position: "position"
    status: "Status"
    callsign: "callsign"
    added: "added airborne"
    serial: "The serial's last digit sets c"
    digit: "last digit"
  flight_state:
    title: "Airborne or on the ground"
    description: "Ground speed from 0 to 14 m/s. On the ground, the Go turns airborne at 12 m/s, 23 kt. Airborne, it turns on the ground below 1 m/s, or after 10 s below 8 m/s. Between the thresholds, the state stays what it was. On the ground, the screen reads TAXI from 1.5 m/s and GROUND again below 1 m/s."
    airborne: "Airborne"
    ground: "On the ground"
    between: "between the thresholds,"
    holds: "the state stays as it was"
    landing: "Landing"
    stop: "below 1 m/s"
    slow: "10 s below 8 m/s"
    hold: "10 s"
    takeoff: "Takeoff"
    fast: "12 m/s, 23 kt"
    taxi: "from 1.5 m/s"
    speed: "Ground speed"
  advisory_ring:
    title: "The advisory ring"
    description: "From above and from the side, the volume around your aircraft: 3 km horizontally and 300 m above and below, a flat cylinder. An aircraft inside it is an advisory. One beyond 3 km, one more than 300 m above and one on the ground are not."
    above: "From above"
    side: "From the side"
    advisory: "advisory"
    far: "too far"
    high: "too high"
    on_ground: "on the ground"
