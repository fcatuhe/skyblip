  second:
    title: "One UTC second"
    description: "One second from 0 to 1200 ms: the Go listens on the uplink from 210 to 440 ms, on channel A from 450 to 820 ms and on channel B from 830 to 1200 ms, with a 10 ms switch between windows. Its positions and Status start from 450 to 810 ms on A or 830 to 990 ms on B, its callsign from 1000 to 1190 ms on B, after ADS-L's direct slot ends at 1000 ms."
    uplink: "Uplink"
    window_1: "Window 1"
    window_2: "Window 2"
    uplink_frequency: "869.525 MHz"
    a_frequency: "868.2 MHz"
    b_frequency: "868.4 MHz"
    uplink_window: "210 to 440 ms"
    a_window: "450 to 820 ms"
    b_window: "830 to 1200 ms"
