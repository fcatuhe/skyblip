        scope:
          term: "Scope"
          definition: "The visits that pass the filters of the bar, over the chosen period. The admin menu opens on the visits without an account, over 30 days, so your own visits stay out."
        segments:
          term: "Segments"
          definition: "Internal: the visits of an admin, and every visit from a browser an admin once signed in from. Users: the same for any other account. Non-users: everyone else."
        visitors:
          term: "Visitors"
          definition: "Distinct visitors, told apart by their browser cookie. A visitor can count in several rows of a tab, so visitors do not add up."
        duration:
          term: "Duration"
          definition: "The average length of whole visits, with the tab visible. Never the time spent on a single page."
        paths:
          term: "Paths"
          definition: "A visit counts in every path it viewed. Pageviews: how many times the path was shown. Duration: the length of the visits that went through the path."
        ranking:
          term: "Rows"
          definition: "The first 10 of each tab, by pageviews."
