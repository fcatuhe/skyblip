    description: "Velocità al suolo da 0 a 14 m/s. A terra, il Go passa allo stato in volo a 12 m/s, 23 kt. In volo, passa allo stato a terra sotto 1 m/s, oppure dopo 10 s sotto 8 m/s. Tra le soglie, lo stato resta invariato. A terra, lo schermo mostra TAXI da 1,5 m/s e di nuovo GROUND sotto 1 m/s."
