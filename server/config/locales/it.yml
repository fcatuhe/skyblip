  cycle:
    title: "Il ciclo di 20 s"
    description: "Venti secondi da c, l'inizio del ciclo fissato dal numero di serie. A terra: una posizione su A a c, un messaggio Status su B a c + 2, un nominativo su B trasmesso all'inizio di c + 5, una posizione su B a c + 9, un messaggio Status su A a c + 11 e un nominativo su B trasmesso all'inizio di c + 15. In volo si aggiunge una posizione ogni secondo, su A nei secondi pari e su B nei dispari, senza spostare il resto."
