      release: Release notes and the .uf2
      recovery: Firmware will not take?
      recovery_hint: "Without Bluetooth: plug the device into a computer and press RST twice within half a second. It shows up as a USB drive named TECHOBOOT: drop the .uf2 file of a release on it."
      recover: Restart into the USB drive
      report_hint: "Send us this line by message or email. Tell us what you did. The line tells us why the update failed."
      report_copy: Copy the report
    terminal:
      title: Terminal
      row: Every Bluetooth frame
      hint: "Each Bluetooth frame appears as this browser exchanges it with the device. > means sent by this browser. < means received from the device."
      endpoints: Endpoints
