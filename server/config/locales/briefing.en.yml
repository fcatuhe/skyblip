      unnamed: A browser with no name
      forget: Forget
      forget_named: "Forget %{name}"
      forget_others: Forget the other browsers
    firmware:
      title: Firmware
      back: "Back to %{name}"
      install: Install
      other: Another image
      file: Or a file ending in .signed.bin
      release: Release notes and the .uf2
      changes: What changed since your version
      recovery: Firmware will not take?
      recovery_hint: "Without Bluetooth: plug the device into a computer and press RST twice within half a second. It shows up as a USB drive named TECHOBOOT: drop the .uf2 file of a release on it."
