      asking_server: Asking skyblip.eu
      registering: Getting its serial
    notices:
      no_bluetooth: This browser has no Web Bluetooth. Use Chrome or Edge, on Android or a computer.
      not_skyblip: This device has no skyBlip update service. It is not a skyBlip, or its firmware is too old for Bluetooth updates.
      link_lost: The link dropped. Bring the device closer and connect again. An upload under way picks up where it stopped.
      not_back: The device did not come back after its restart. Connect it again.
      timeout: The device stopped answering. Reconnect and try again.
      no_params: The device did not say how much it takes at once. Reconnect.
      claimed: Another app holds this device's settings. Close it, then reconnect.
      small_mtu: This phone or browser kept Bluetooth's smallest packet, too small for the answer. Reconnect. If it happens again, update the browser or use another phone or a computer.
      in_flight: It is flying. Install once it has landed. Older firmware also waits for a GPS fix.
      low_power: The battery is too low to install. Charge it first.
      expired: Nobody pressed twice within thirty seconds. Try again.
      cancelled: Refused on the device. It asks nothing more until you reconnect.
      refused_on_device: Refused on the device. It asks nothing more until you reconnect.
      prompt_pending: The device is already asking a question. Answer it, or wait thirty seconds.
      nothing_staged: The device could not read the image back. Install again.
      not_approved: The image that arrived is not the version you allowed. Install again.
      window_closed: "The upload window closed. Install again: it picks up where it stopped."
      older: This image is older than the firmware on the device, and a released device never goes back.
      wrong_key: This image is signed for another kind of device, development or release. Choose an image of its kind.
      wrong_product: This image is for another skyBlip product. Choose one whose name starts with the device's.
      unmarked_image: This image names no product. Choose a newer one, or drop its .uf2 on the USB drive.
      too_large: This image is too big for the device.
      not_image: This is not a signed firmware image. Choose the file ending in .signed.bin.
      flash: The device could not write the image. Try again, then try the USB drive.
      unknown_command: This firmware is too old for that. Update it over USB.
      no_file: Choose an image first.
      needs_full: This device needs the image with the sensor hub firmware, ending in .full.signed.bin.
      shelf_failed: The image did not download. Check the connection and choose it again.
      smp: "The device refused the image:"
      failed: "Something failed:"
      refused: "The device refused:"
      probation: The new firmware is proving itself. This takes a few seconds.
      reverted: "The new firmware did not prove itself, so the device went back to the one it had. Try again. If it happens twice, tell us which version:"
      image_refused: "The device would not start the update, the image failed its check, and it kept the firmware it had. Download it again:"
      install_report:
        slot_damaged: The new firmware arrived damaged in the device's storage, so it kept the one it had. Install again.
        slot_unreadable: The device could not read the new firmware back from its storage, so it kept the one it had. Install again.
        slot_undigested: The new firmware carries no checksum, so the device kept the one it had. Download the image again.
        swap_not_marked: The device could not mark the new firmware for install, so it started the one it had.
        bootloader_refused: The device's bootloader refused the new firmware without starting it, so it kept the one it had.
        probation_failed: The new firmware started, then stopped before it proved itself, so the device went back to the one it had.
        no_record: "The device came back on %{running}, not %{attempted}, and kept no record of the install."
      settings_prior: Its settings are the ones from before the update. Check them.
      settings_defaults: It lost its settings and runs on defaults. Check the callsign and the aircraft type.
      swap_unpowered: The battery is critical, too low to install. Charge it first.
      went_dark_flat: It last switched off on a flat battery. Charge it before you install.
      imu_writing: Writing the sensor hub firmware, up to a minute. Leave it on.
      no_key: This firmware is too old to name the key it trusts. Install one file by hand once, the .full.signed.bin of a release.
      not_activated: Not activated yet, so it neither transmits nor receives.
      recovering: "The device is now a USB drive named TECHOBOOT. If its glass reads PRESS THE BUTTON TO START IT, press once. Drop the .uf2 file on it, or press RST to go back to skyBlip. Nothing transmits meanwhile."
    set_notices:
      saved: Saved on the device.
      in_flight: It is flying, so nothing changed. Save once it has landed.
      low_power: The battery is too low to store settings. Charge it first.
      expired: Nobody pressed twice within thirty seconds, so nothing changed.
      cancelled: Refused on the device, so nothing changed.
      refused_on_device: Refused on the device, so nothing changed.
      prompt_pending: The device is already asking a question. Answer it, or wait thirty seconds.
      unknown_command: This firmware is too old to change settings. Update it first.
    capture_notices:
      capture_armed: Armed. The lamp winks twice every 3 s until the capture stops, flights included.
      capture_stopped: Stopped. The lamp is back to its single wink.
      capturing: A capture already runs. Stop it first.
      not_capturing: No capture runs, so there is nothing to stop.
      no_storage: This Bravo has no memory for a capture. Tell us, with its firmware version.
      in_flight: It is flying, so nothing changed. Try again once it has landed.
      expired: Nobody pressed twice within thirty seconds, so nothing changed.
      cancelled: Refused on the device, so nothing changed.
      refused_on_device: Refused on the device, so nothing changed.
      prompt_pending: The device is already asking a question. Answer it, or wait thirty seconds.
      unknown_command: This firmware is too old to capture. Update it first.
    browsers_notices:
      invalid: The device could not read which browser to forget. Reload the page and try again.
      unknown_browser: The device no longer trusts that browser.
      untrusted: The device no longer trusts this browser. Reconnect.
      timeout: The device stopped answering. Reconnect and try again.
    activation_notices:
      activated: "Activated: %{name}. Its radio is on. Add your callsign and aircraft type."
      no_bluetooth: This browser has no Web Bluetooth. Use Chrome or Edge, on Android or a computer.
      not_skyblip: That device has no skyBlip settings service. It is not a skyBlip.
      link_lost: The link dropped. Bring the unit closer, connect again and activate again.
      failed: "Something failed:"
      refused: "The unit refused:"
      keyless: The unit could not read or make its own key. Restart it and activate again.
      no_session: The unit no longer holds the number this activation started from. Activate again.
      bad_signature: The unit did not recognise what skyblip.eu signed. Activate again. If it happens twice, tell us which firmware it runs.
      small_mtu: This phone or browser kept Bluetooth's smallest packet, too small for the answer. Reconnect. If it happens again, use another phone or a computer.
      in_flight: This unit is already activated, and it is flying. Activate it again once it has landed.
      low_power: The battery is too low to store the serial. Charge it, then activate.
      flash: The unit could not store its serial. Activate again. If it happens again, tell us.
      expired: Nobody pressed twice within thirty seconds. Activate again.
      cancelled: Refused on the Go. Reconnect, then activate again.
      refused_on_device: Refused on the Go. Reconnect, then activate again.
      prompt_pending: The unit is already asking a question. Answer it, or wait thirty seconds.
      claimed: Another app holds this unit's settings. Close it, then reconnect.
      unknown_command: This firmware is older than activation and needs none. Update it first.
      server_unknown_server_key: This firmware trusts a key skyblip.eu does not hold. Install a release first.
      server_expired: More than five minutes passed. Activate again.
      server_bad_signature: skyblip.eu could not check what the unit signed. Activate again. If it happens twice, tell us which firmware it runs.
      server_other_key: "skyblip.eu knows this unit under another key, so it gave no serial. Write to us with this code:"
      server_revoked_key: "skyblip.eu revoked this unit's key. Write to us with this code:"
      server_daily_cap: skyblip.eu activated as many new units today as it does in a day. Try again tomorrow.
      server_network_cap: Your connection activated as many new units today as it may. Try again tomorrow, or write to us for a fleet.
      server_no_serial: Every serial is assigned. Write to us.
      server_rate_limited: Too many requests from your connection. Wait a minute, then activate again.
      server_invalid: skyblip.eu could not read the request. Reload the page and activate again.
      server_unreachable: skyblip.eu did not answer. Check the internet connection, then activate again.
      server_failed: "skyblip.eu failed to answer:"
