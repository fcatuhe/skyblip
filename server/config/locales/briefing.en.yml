      aircraft_bravo: "In the aircraft, switch the transponder to ALT and open Briefing: it offers the address Bravo hears, so Bravo leaves your own transponder out of the traffic. Without a transponder, there is nothing to set."
      transponder_go: Has a transponder? Its address, if you know it
      transponder_known: Know its address already? Enter it now
      done_go: "%{name} is ready. Its settings stay on its page."
      done_tango: "Your Tango is ready: %{name} shows the ADS-B traffic %{partner} hears."
      done_bravo: "%{name} is ready."
      open: "Open %{name}"
      images_unavailable: The skyBlip images did not load. Check the connection, then reload the page.
    setup_notices:
      port_closed: "Nothing listed? Switch the device on and try another cable: many USB-C cables only charge. A unit already running skyBlip lists no USB port: connect it over Bluetooth."
      port_failed: "The USB port could not be opened:"
      port_busy: "Another program is using the device. Close it, then click Install again."
      other_board: "This board does not run skyBlip. skyBlip runs on a LilyGO T-Echo or T-Echo Plus, and on a Seeed MeshTracker X1."
      not_drive: "That is not the drive. Choose the drive named TECHOBOOT or X1."
      drive_denied: "Briefing needs permission to save to the drive. Choose it again, and click Allow or Save changes."
      drive_failed: "The drive could not be opened:"
      download_failed: "The skyBlip image did not download. Check the connection, then choose the drive again."
      no_image: No skyBlip image is published for this device yet.
      image_not_uf2: The published file is not a UF2 image. Tell us.
      image_wrong_product: The published image is for the other product. Tell us.
      image_no_image: The published file holds no skyBlip image. Tell us.
      image_no_room: "The image leaves no room for this browser's key, so the device will ask for its presses."
      write_failed: "The drive refused the file. Unplug the device, plug it back in, then try again:"
      failed: "Something failed:"
