      activate: Activate
      kept_summary: What skyblip.eu keeps
      kept: skyblip.eu keeps the device's chip identifier, key, serial number and firmware, along with the internet address used for activation. No account.
    glass:
      header: AUTHORISE
      allow: PRESS TWICE TO ALLOW
      refuse: ONE PRESS REFUSES
      lamp: The LED blinks green fast.
      remembers: "Allowing it also adds this browser to the trusted list. Future saves and updates need no button press. You can forget the browser from this page."
    tools:
      back: Back to your devices
      title: Developer tools
      console: Bluetooth console
