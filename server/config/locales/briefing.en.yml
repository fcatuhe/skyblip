      endpoints: Endpoints
      pause: Pause
      resume: "Resume (%{count} new)"
      clear: Clear
      tape: Bluetooth frames
      opened: link open
      closed: link closed
      failed: failed
    activation:
      title: Activate a new Go
      hint: Its screen shows NOT ACTIVATED and a code like 3F2A. Choose that code in the list.
      find: Find the new Go
      activate: Activate
      kept_summary: What skyblip.eu keeps
      kept: skyblip.eu keeps the device's factory identifier, public key, serial number and firmware. The Go transmits in ADS-L, so activation assigns it an address from skyBlip's range in the ADS-L registry. No account needed.
    setup:
      title: Set up a device
