        bravo: "Bravo: unplug it, hold its button, plug it back in, and release once the light turns white."
      choose_drive: Choose the drive
      downloading: "Downloading skyBlip for %{name}."
      writing: "Installing skyBlip %{version} on %{name}."
      keep_plugged: Keep it plugged in. This takes a few seconds.
      installed: "Installed. Last step: connect %{name} over Bluetooth."
      installed_trusted: "Installed. Last step: connect %{name} over Bluetooth. It trusts this browser, so it asks for no button press."
      connect: Connect
      choose_in_list: "Choose %{name} in the list."
      activating: "Activating %{name}."
      confirm_activation: Press the Go's button to activate it.
      the_device: the device
      unsupported_phone: "Install from a computer first, in Chrome or Edge. This phone then sets up and updates your devices over Bluetooth."
      unsupported_other: Installing over USB needs Chrome or Edge on a computer.
      by_hand_link: Install it by hand instead
      guide_go: New to the Go? Read its first steps.
      guide_bravo: New to Bravo? Read its first steps.
      try_again: Try again
      save: Save
      later: Later
      done: Done
      set_now: Set them now
      aircraft_go: "Name your aircraft. Other pilots see its callsign and type. You can change both later, on the Go or in Briefing."
