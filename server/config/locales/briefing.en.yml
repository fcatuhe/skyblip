      stop: Stop the capture
      idle: Nothing is recording.
      running: "Recording a %{profile} capture: %{records} records so far. The device keeps the last %{keeps} of it."
      price: "A full capture keeps %{full}, a power run or a flight run %{run}."
      erases:
        one: "Starting one erases 1 stored flight."
        other: "Starting one erases %{count} stored flights."
      months:
        one: 1 month
        other: "%{count} months"
      send: Fetch and send
      send_hint: "Stop the capture, then send it to skyBlip from here. It holds your positions and the aircraft you heard. We keep a full capture %{full} and a power run or a flight run %{run}, then delete it."
      fetching: "Reading the capture: %{at} of %{total} records."
      uploading: Sending the capture.
      sent: "Sent. Give your support code %{code} when you write to us."
      empty: The device holds no capture.
      not_sent: "The capture could not be sent: %{detail}. Try again later."
    report:
      title: Send a report
      hint: "Sends the device's counters to skyBlip, with no position and no address. Use it when the device misbehaves."
      send: Send a report
      sent: "Sent. Give your support code %{code} when you write to us."
      not_sent: "The report waits in this browser and leaves once it is online. Your support code is %{code}."
    browsers:
      title: Trusted browsers
      hint: "These browsers can change the device's settings and start updates without a button press on the device. A browser joins the list when you press to allow its first save or update."
