    description: "Vingt secondes depuis c, le départ du cycle fixé par le numéro de série. Au sol : une position sur A à c, un Status sur B à c + 2, un indicatif sur B émis au début de c + 5, une position sur B à c + 9, un Status sur A à c + 11 et un indicatif sur B émis au début de c + 15. En vol, le Go ajoute une position chaque seconde, sur A pendant une seconde paire et sur B pendant une impaire, sans rien déplacer d\u2019autre."
