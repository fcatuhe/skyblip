CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# The window watchdog.h asserts against runtime::kHardwareWatchdogCeilingMs, as products/skyblip_go/prj.conf sets it.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000

# The board's own parts, which the smoke image exercises for the first bench (#169).
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_VOLTAGE_DIVIDER=y
CONFIG_POWEROFF=y

# The settings store on storage_partition, and slot1 on the QSPI NOR.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# The bench reads the smoke image over USB CDC, under the identity the Bravo product will carry.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="skyBlip"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="skyBlip Bravo"
CONFIG_CDC_ACM_SERIAL_VID=0x1209
CONFIG_CDC_ACM_SERIAL_PID=0x5AFE
CONFIG_CDC_ACM_SERIAL_MAX_POWER=125
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# A .uf2 writes slot0 directly, so only an image already marked good survives its second boot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y

# The byte the factory bootloader reads at boot, written before SYSTEM OFF.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y
CONFIG_RETENTION=y
