# The board's console is USB CDC, which MCUboot does not build, so it gets none.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# Recovery is the factory bootloader's drag-and-drop, so MCUboot carries no serial or USB DFU.
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_USB_DFU_WAIT=n

# Slot1 on the QSPI NOR, in 4 KB pages, the internal flash's page, as swap-using-offset requires.
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16

# 181 sectors per slot, pinned so an undercount fails the build rather than a swap.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=192

# The application's watchdog survives the reset into MCUboot, so a long swap feeds it.
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_WATCHDOG_FEED_NRFX_WDT=y
