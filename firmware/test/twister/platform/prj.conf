CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
# The radio executor and the SX1262 model are written against the host standard library here.
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# native_sim has no flash: the simulator provides the storage_partition the
# adapter mounts NVS on, which is the whole point of running it here.
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_STATS=n
# The radio executor arms its DIO1 wake on the emulated GPIO app.overlay names.
CONFIG_GPIO=y
