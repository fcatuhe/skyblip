# Zephyr's module scanner reads this to find the tree's boards and Kconfig.
name: skyblip

build:
  # Zephyr and twister append boards/ to this, for west build, sysbuild's MCUboot and twister alike.
  settings:
    board_root: .
  # The options the shared layers read, whichever product builds them.
  kconfig: zephyr/Kconfig
