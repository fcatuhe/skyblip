# Kconfig fragment for the MCUboot image built by sysbuild (sysbuild.conf).
#
# MCUboot is a SEPARATE Zephyr application. It inherits the board devicetree -
# where `zephyr,console` is &cdc_acm_uart0 - but not this app's prj.conf, so it
# never builds the USB device stack. uart_console.c then references a device
# object that was never instantiated and the bootloader fails to link with
# `undefined reference to __device_dts_ord_96`.
#
# The T-Echo has no debug UART, so the bootloader has nowhere to print anyway:
# give it no console at all. Smaller bootloader, and one less thing to go wrong
# before the application is even running.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# No serial recovery and no USB DFU inside MCUboot. Recovery is the factory
# Adafruit bootloader's USB mass storage - drag-and-drop, no host tools - which
# MCUboot cannot offer at all (it has no MSC class, only BOOT_USB_DFU_* needing
# dfu-util and BOOT_SERIAL_* needing mcumgr).
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_USB_DFU_WAIT=n

# Reach the secondary slot on the external flash
# The board devicetree puts slot1_partition under &ext_flash, so MCUboot has to
# be able to drive that chip. GPIO is needed too:
# boards/lilygo/t_echo_plus/board.c raises the rail that powers the flash, and
# parks its WP#/HOLD# lines, before this driver initialises.
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# MUST MATCH THE APPLICATION. MCUboot is a separate image with its own Kconfig,
# so the SFDP-runtime decision has to be repeated here or the BOOTLOADER still
# cannot read the secondary slot on a ZD25WQ16B unit - and then nothing is
# fixed, because the bootloader is what performs the swap. See
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# NOT OPTIONAL. This driver defaults its FLASH_PAGE_LAYOUT page size to the
# 64 KB block size. Swap-using-offset requires "all slot's sectors ... of the
# same size" (mcuboot docs/design.md:299-300), and slot0 is in internal flash
# whose page is 4096 B. Leaving this at 65536 makes the two slots disagree and
# corrupts swaps.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# 182 sectors in slot0, 183 in slot1. Pinned rather than left to
# BOOT_MAX_IMG_SECTORS_AUTO because an undercount across two different flash
# devices is a silent swap corruption, not a build error.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=192

# The nRF52 WDT is not reset by a soft reset (Nordic DevZone, confirmed by staff):
# the application's 12 s rope is still running when this image starts a swap that
# takes longer than that. Default y on Nordic; stated because a swap that dies at
# 12 s looks exactly like a bad image.
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_WATCHDOG_FEED_NRFX_WDT=y

# Update policy
# Refuse an image whose version is LOWER than the running one. Equal is allowed:
# in a swap mode the check is boot_compare_version(secondary, primary) < 0
# (mcuboot boot/bootutil/src/loader.c check_downgrade_prevention). Covers the
# OTA path only - a drag-and-drop downgrade is always possible and that is
# accepted (physical possession of your own device).
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Without this, boot_compare_version() stops at major.minor.revision
# (bootutil_loader.c:236-244) and every build of one release compares equal, so
# the build number CI puts in the header would order nothing. With it, an image
# from an older build is refused. scripts/build_local.sh stamps the commit count.
# The application side has to agree: prj.conf sets
# CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER.
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y
