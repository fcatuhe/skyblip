# What the Go's MCUboot adds to products/common/sysbuild/mcuboot.conf.

# Slot1 on the SPI NOR, with the application's SFDP and 4 KB page choices: MCUboot performs the swap, so it must read both parts LilyGO fit.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# Single-threaded, so polling the busy bit beats sleeping 50 ms per external sector erase of a swap.
CONFIG_SPI_NOR_SLEEP_WHILE_WAITING_UNTIL_READY=n
