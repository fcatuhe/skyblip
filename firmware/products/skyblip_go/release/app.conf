# Kconfig fragment for the application in a release build, beside mcuboot.conf.
# MCUboot was built with MCUBOOT_DOWNGRADE_PREVENTION, and the application has to
# agree or it will offer upgrades the bootloader will reject
# (share/sysbuild/images/bootloader/Kconfig:52-53). hal::Dfu reads it back as
# downgrade_allowed(), which the upload hook, "apply" and the update frame use.
CONFIG_MCUBOOT_BOOTLOADER_NO_DOWNGRADE=y
