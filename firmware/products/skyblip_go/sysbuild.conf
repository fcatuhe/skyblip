# The factory UF2 bootloader stays at 0xF4000 and chain-loads MCUboot, so a bad MCUboot is a .uf2 away from recovery.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Set although it is the default, because the slot geometry in the board devicetree depends on it.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# Signed images with rollback. The key path is injected by scripts/build_image.sh, never kept here (../common/README.md).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
