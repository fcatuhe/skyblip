# sysbuild.conf: build MCUboot alongside the application.
#
#   west build -b t_echo_plus firmware --sysbuild
#
# MCUboot is NOT the reset vector here. The factory Adafruit nRF52 UF2
# bootloader stays at 0xF4000 and chain-loads MCUboot from boot_partition
# (0x26000), which then verifies and boots slot0. That is what keeps
# drag-and-drop install working AND makes MCUboot itself field-recoverable:
# a bad bootloader is a double-tap and a .uf2, not an SWD session.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Swap-using-offset reserves ONE SPARE SECTOR IN THE SECONDARY SLOT so sectors
# have somewhere to move during a swap (mcuboot docs/design.md:283-320). Our
# secondary slot is on the external 2 MB SPI NOR part, so that sector costs us
# nothing, whereas swap-using-move would have taken it out of internal flash.
# MCUboot's own docs say offset "is preferred over swap-using-move except when
# building for existing products already using the latter" (design.md:325-326).
#
# This is already sysbuild's default (share/sysbuild/images/bootloader/
# Kconfig:37); set explicitly because the slot geometry in the board devicetree
# depends on it and a silent default change would corrupt swaps.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# Signed images, with rollback. NOT BOOT_UPGRADE_ONLY: its Kconfig help states
# it "prevents the fallback recovery", and automatic revert on a failed update
# is the property that distinguishes this from every peer project's OTA.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The signing key is NEVER in this repository, and its path is NOT set here.
#
# It cannot be: Kconfig only expands $(VAR) inside Kconfig definition files, not
# inside .conf fragments, so an environment reference written here survives as a
# literal string and ends up in build.ninja as a bad $-escape.
#
# So the path is injected as a generated fragment instead:
#
#   echo 'SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/abs/path/key.pem"' > /tmp/key.conf
#   west build -b t_echo_plus . --sysbuild -- -DSB_EXTRA_CONF_FILE=/tmp/key.conf
#
# Without that fragment the build falls back to MCUboot's PUBLISHED
# root-ec-p256.pem (share/sysbuild/images/bootloader/Kconfig:199) - a key
# everyone has, so the signature proves nothing. That is tolerable for a local
# build, which is never distributed. CI signs with a key of its own and fails
# unless the image verifies against the one in firmware/keys/ for its environment.
