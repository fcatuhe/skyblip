# prj.conf: what skyBlip Go on the T-Echo Plus adds to products/common/prj.conf.

# uart_configure() for the L76K's raise to 115200 and its autobaud, which Nordic's SoC defconfig turns off.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# A Go is activated at skyblip.eu: it keeps a key of its own and trusts the server key (core/identity/README.md).
CONFIG_SKYBLIP_ACTIVATION=y
# The T-Echo Plus's BHI260AP boots from an image the build pins. Sysbuild decides whether the app carries it.
CONFIG_SKYBLIP_IMU_IMAGE=y

# Off although the devicetree declares it: our own driver reads the BME280 (hardware/parts/).
CONFIG_BME280=n

# Slot1 and the flight logs on the SPI NOR. SFDP_RUNTIME reads the chip's geometry, so one image updates both the MX25R1635F and the ZD25WQ16B LilyGO fit.
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
# The 4 KB sector of internal flash, which swap-using-offset needs in both slots, as sysbuild/mcuboot.conf sets it.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# The default 50 ms poll rounds each log-sector erase up in 50 ms steps, past kSectorEraseCostMs. 1 ms still sleeps, so the SMP workqueue and the log thread below main are not starved.
CONFIG_SPI_NOR_SLEEP_ERASE_MS=1

# A paired Go connects to its Bravo as a central and scans to find it (#178), and subscribes to its peer characteristic once found.
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="skyBlip Go"

CONFIG_MCUBOOT_IMGTOOL_UUID_CID_NAME="skyblip_go"
