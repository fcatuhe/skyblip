# prj.conf: the Kconfig every product loads before its own prj.conf (cmake/skyblip.cmake).

# C++20 with the tree's no-exceptions, no-RTTI profile.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_GLIBCXX_LIBCPP=y

# Link-time optimisation over the whole image, which needs the ISR tables declared where IRQ_CONNECT is.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# The radio on SPI, the buzzer on PWM, and the GNSS UART read from its receive interrupt: a polled UARTE drops half of every NMEA sentence.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PWM=y

# The sensor buses, whose parts are our own drivers (hardware/parts/).
CONFIG_I2C=y
# Pinned to Zephyr 4.4's 500 ms: the st_b_cams_imx_mb1854 shield's unguarded defconfig raises it to 1000 in every 4.5 build with SENSOR.
CONFIG_I2C_TRANSFER_TIMEOUT_MS=500

# The die sensor, through the driver that serialises it with the radio's own reads, and the battery divider, through Zephyr's sensor API.
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y
CONFIG_ADC=y
CONFIG_VOLTAGE_DIVIDER=y

# FICR DEVICEID and the reset cause, and RNG material bias-corrected, because a key from the raw RNG is biased.
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_BIAS_CORRECTION=y

# Settings in NVS. Without MPU_ALLOW_FLASH_WRITE a runtime flash write fails silently on the nRF52840.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# An 85 ms page erase in 4 ms slices, under core/timing::kSwitchRetuneMs (core/timing/durable_write.h).
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=4

# The companion link (hardware/platform/zephyr/link.cpp), with every service defined statically.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ATT_PREPARE_COUNT=2
# The unit sends its own Exchange MTU Request at connect: Android leaves it to the app (core/comms/README.md).
CONFIG_BT_GATT_CLIENT=y
# Re-subscribing needs bonds, and BT_SMP is off.
CONFIG_BT_GATT_AUTO_RESUBSCRIBE=n
# Two cockpit devices and a phone configuring the unit: link.cpp asserts core/comms/link_sessions.h agrees.
CONFIG_BT_MAX_CONN=3
# Four notifications in flight per phone, one response and one SMP reply each, and a paired peer's write, request and response: att_budget.h asserts it.
CONFIG_BT_ATT_TX_COUNT=18
# The product names the unit at boot (link.cpp), and no peer may rename it.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
# The ATT MTU ceiling, from Zephyr's smp_svr sample. A phone may settle lower, and link.cpp sizes every frame to what it settled at.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# BT_SMP stays off: encrypted characteristics fail Web Bluetooth on Windows, and MCUboot's signature guards an install. No link is encrypted, so the controller carries no LE encryption.
CONFIG_BT_CTLR_LE_ENC=n

# Signed DFU over MCUmgr/SMP into MCUboot, the image bound to its product as MCUboot's image class (core/dfu/README.md).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_UUID_VID=y
CONFIG_MCUBOOT_IMGTOOL_UUID_VID_NAME="skyblip.eu"
CONFIG_MCUBOOT_IMGTOOL_UUID_CID=y
# A .uf2 writes slot0 directly, so only an image already marked good survives its second boot.
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
# Compares the build number as a release MCUboot does. release/ sets the downgrade rule, and scripts/build_image.sh asserts both images agree.
CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER=y
# Kconfig only warns when IMG_MANAGER's dependencies are missing, and drops signed DFU from a build that looks fine.
CONFIG_STREAM_FLASH=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_IMG_MANAGER=y
# One sector ahead of each chunk: erasing the whole extent first, 40 ms typical and 240 ms worst per MX25R sector, is 20 s a phone reads as a dead device.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_REBOOT=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MCUMGR_GRP_IMG_TOO_LARGE_SYSBUILD=y

# The command hook is the one SMP hook that can refuse any command: mcumgr_hooks.cpp gates the upload on the press and refuses every other write.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# GPREGRET, the byte the factory bootloader reads at boot, for recovery and for a switch-off.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y
CONFIG_RETENTION=y

# The task watchdog over the WDT, its window runtime::kHardwareWatchdogCeilingMs, with the fewest channels Zephyr allows for its one task_wdt_add.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_TASK_WDT_CHANNELS=2

# POFCON through nrfx, which is its only path, and SYSTEM OFF through sys_poweroff().
CONFIG_NRFX_POWER=y
CONFIG_POWEROFF=y

# No log and no console: a phone reads the diagnostics over the link.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# The service loop runs the Ed25519 checks on this stack (core/crypto/README.md).
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_ASSERT=y
# Nothing prints an assert, so it keeps its check and drops the strings Zephyr 4.5 compiles in by default.
CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_TERSE=y
