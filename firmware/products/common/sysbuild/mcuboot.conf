# MCUboot's Kconfig every product shares, appended after its own sysbuild/mcuboot.conf by its sysbuild.cmake.

# No serial, no log and no banner: the bootloader has no port to print on.
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# Recovery is the factory bootloader's drag-and-drop, so MCUboot carries no serial or USB DFU.
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_USB_DFU_WAIT=n

# Slot1 is on the external NOR, whose rail and lines the board drives through GPIO before the driver starts.
CONFIG_GPIO=y
CONFIG_FLASH=y

# 192 covers the larger slot's 183 sectors, pinned because an undercount across two flash devices corrupts a swap silently.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=192

# The nRF52 WDT survives the reset into MCUboot, so a swap longer than the application's 12 s rope feeds it.
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_WATCHDOG_FEED_NRFX_WDT=y
