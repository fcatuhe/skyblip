# MCUboot in a release build, added by scripts/build_image.sh with SKYBLIP_CHANNEL=production.

# Refuses an image older than the running one over the air, while a drag-and-drop downgrade stays the owner's choice.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Compares the build number too, so an older build of one release is refused, as products/common/prj.conf agrees.
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y
