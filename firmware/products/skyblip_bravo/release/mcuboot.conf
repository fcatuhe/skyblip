# Kconfig fragment for MCUboot in a release build, added by scripts/build_image.sh
# with SKYBLIP_CHANNEL=production. A development build leaves it out, so its
# bootloader takes any image signed by its key, older ones included.
#
# Update policy
# Refuse an image whose version is LOWER than the running one. Equal is allowed:
# in a swap mode the check is boot_compare_version(secondary, primary) < 0
# (mcuboot boot/bootutil/src/loader.c check_downgrade_prevention). Covers the
# OTA path only - a drag-and-drop downgrade is always possible and that is
# accepted (physical possession of your own device).
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Without this, boot_compare_version() stops at major.minor.revision
# (bootutil_loader.c:236-244) and every build of one release compares equal, so
# the build number CI puts in the header would order nothing. With it, an image
# from an older build is refused. scripts/build_image.sh stamps the commit count.
# The application side has to agree: prj.conf sets
# CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER.
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y
