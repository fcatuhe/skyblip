# MCUboot sits at the X1's application origin and the factory UF2 bootloader chain-loads it, as on the Go.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Slot1 is on the QSPI NOR, so the spare sector swap-using-offset needs costs no internal flash.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# Signed images with rollback; the key path is injected by scripts/build_image.sh, never kept here.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
