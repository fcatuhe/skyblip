# prj.conf: base Kconfig for skyBlip Bravo on the Seeed MeshTracker X1. products/skyblip_go/prj.conf says why each shared block is set as it is.

# C++20 with the tree's no-exceptions, no-RTTI profile.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y

# The LR2021 on SPIM3, the AG3335 on UARTE0 read from its receive interrupt, the buzzer on PWM.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PWM=y

# The SPA06 and the DRV2605 on TWIM0, the YSN8900 on TWIM1, all driven by our own parts.
CONFIG_I2C=y

# The die sensor and the battery divider, through Zephyr's sensor API.
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y
CONFIG_ADC=y
CONFIG_VOLTAGE_DIVIDER=y

# Bravo is never activated: no unit key, no server key (core/identity/README.md).
CONFIG_SKYBLIP_ACTIVATION=n

# pid.codes allocated PID 0x5AFE under its VID 0x1209 to skyBlip, so a copy requests its own PID from pid.codes.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="skyBlip"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="skyBlip Bravo"
CONFIG_CDC_ACM_SERIAL_VID=0x1209
CONFIG_CDC_ACM_SERIAL_PID=0x5AFE
CONFIG_CDC_ACM_SERIAL_MAX_POWER=125
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Settings in NVS on storage_partition, the flights and the capture on the NOR's log_partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=4

# The GD25Q64E on the QSPI peripheral, single-line, in the 4 KB pages swap-using-offset needs.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# The companion link: NMEA on the two public profiles, config and the log on ours (hardware/platform/zephyr/README.md).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_RESUBSCRIBE=n
CONFIG_BT_MAX_CONN=3
CONFIG_BT_ATT_TX_COUNT=18
CONFIG_BT_DEVICE_NAME="skyBlip Bravo"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32

# The peer characteristic its paired Go writes and reads (#192).
CONFIG_SKYBLIP_PEER_SERVER=y

# The Go's ceiling: past the 129 B MTU and 133 B ACL buffers the 126 B peer frame needs (#176, #177).
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Signed DFU over MCUmgr/SMP into MCUboot, the image bound to this product (core/dfu/README.md).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_UUID_VID=y
CONFIG_MCUBOOT_IMGTOOL_UUID_VID_NAME="skyblip.eu"
CONFIG_MCUBOOT_IMGTOOL_UUID_CID=y
CONFIG_MCUBOOT_IMGTOOL_UUID_CID_NAME="skyblip_bravo"
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER=y
CONFIG_STREAM_FLASH=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_REBOOT=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MCUMGR_GRP_IMG_TOO_LARGE_SYSBUILD=y

# The SMP hooks that gate an upload on the two presses and refuse every other write (hardware/platform/zephyr/mcumgr_hooks.cpp).
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# The byte the factory bootloader reads at boot, for recovery and for a switch-off.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y
CONFIG_RETENTION=y

# The task watchdog with its hardware fallback, at runtime::kHardwareWatchdogCeilingMs.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_TASK_WDT_CHANNELS=4

# POFCON through nrfx, and SYSTEM OFF through sys_poweroff().
CONFIG_NRFX_POWER=y
CONFIG_POWEROFF=y

# The service loop, as the Go's.
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_ASSERT=y

# Each 1090 MHz frame the decoder refused, on a development image's console, with log room for 32 of them. release/app.conf sets info back (README.md, Reading the rejects).
CONFIG_SKYBLIP_BRAVO_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=4096

# The reception trial of #293 on a development image, removed with it. release/app.conf turns it off.
CONFIG_SKYBLIP_BRAVO_ADSB_TRIAL=y
